info:
  name: Create recipe
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASEURL}}/recipes"
  headers:
    - name: x-api-key
      value: "{{API_KEY}}"
  body:
    type: json
    data: |-
      {
        "title": "Ofengemüse",
        "description": "Buntes Gemüse aus dem Ofen",
        "category": "Hauptgericht",
        "time_in_minutes": 35,
        "portions": 4,
        "difficulty": "einfach",
        "ingredients": ["Zucchini", "Paprika", "Tomaten", "Olivenöl"],
        "instructions": ["Gemüse schneiden", "Mit Öl mischen", "Im Ofen rösten"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
