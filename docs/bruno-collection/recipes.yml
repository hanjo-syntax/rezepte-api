info:
  name: recipes
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASEURL}}/recipes?category=Vorspeise&difficulty=einfach&max_time=30"
  params:
    - name: category
      value: Vorspeise
      type: query
    - name: difficulty
      value: einfach
      type: query
    - name: max_time
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Shows every recipe
